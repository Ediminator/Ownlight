# ==============================================================================
# Synology Docker Compose Production Stack for Ownlight
#
# IMPORTANT:
#  - Host web traffic is mapped to port 3030 by default (${PORT:-3030}:3000)
#    to prevent port collisions with self-hosted Synology Gitea running on port 3000.
#  - Zero hardcoded fallback credentials: all secrets must be configured in .env.synology.
#  - PostgreSQL role separation: ownlight_migrator (DDL) vs. ownlight_app (DML-only).
# ==============================================================================

services:
  web:
    image: ghcr.io/ediminator/ownlight:latest
    restart: unless-stopped
    ports:
      - '${PORT:-3030}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: '0.0.0.0'
      DATABASE_URL: 'postgresql://${POSTGRES_APP_USER:-ownlight_app}:${POSTGRES_APP_PASSWORD:?Error: POSTGRES_APP_PASSWORD must be set in .env.synology}@db:5432/${POSTGRES_DB:-ownlight_prod}'
      MIGRATION_DATABASE_URL: 'postgresql://${POSTGRES_MIGRATOR_USER:-ownlight_migrator}:${POSTGRES_MIGRATOR_PASSWORD:?Error: POSTGRES_MIGRATOR_PASSWORD must be set in .env.synology}@db:5432/${POSTGRES_DB:-ownlight_prod}'
      AUTH_SECRET: '${AUTH_SECRET:?Error: AUTH_SECRET must be set in .env.synology}'
      AUTH_URL: '${AUTH_URL:?Error: AUTH_URL must be set in .env.synology}'
      TRUSTED_PROXY_COUNT: '${TRUSTED_PROXY_COUNT:-1}'
      SETUP_TOKEN: '${SETUP_TOKEN:-}'
      ENCRYPTION_KEY: '${ENCRYPTION_KEY:?Error: ENCRYPTION_KEY must be set in .env.synology}'
      STORAGE_ACCESS_KEY: '${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}'
      STORAGE_SECRET_KEY: '${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}'
      AUTO_MIGRATE: '${AUTO_MIGRATE:-true}'
      # Optional SMTP configuration
      SMTP_HOST: '${SMTP_HOST:-127.0.0.1}'
      SMTP_PORT: '${SMTP_PORT:-587}'
      SMTP_USER: '${SMTP_USER:-}'
      SMTP_PASSWORD: '${SMTP_PASSWORD:-}'
      SMTP_SECURE: '${SMTP_SECURE:-false}'
      EMAIL_FROM: '${EMAIL_FROM:-}'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    image: ghcr.io/ediminator/ownlight:latest
    command: node scripts/worker.mjs
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: 'postgresql://${POSTGRES_APP_USER:-ownlight_app}:${POSTGRES_APP_PASSWORD:?Error: POSTGRES_APP_PASSWORD must be set in .env.synology}@db:5432/${POSTGRES_DB:-ownlight_prod}'
      AUTH_URL: '${AUTH_URL:-http://localhost:3030}'
      AUTH_SECRET: '${AUTH_SECRET:?AUTH_SECRET is required}'
      STORAGE_ACCESS_KEY: '${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}'
      STORAGE_SECRET_KEY: '${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}'
      ENCRYPTION_KEY: '${ENCRYPTION_KEY:?Error: ENCRYPTION_KEY must be set in .env.synology}'
      SETUP_TOKEN: '${SETUP_TOKEN:-}'
      AUTO_MIGRATE: 'false'
      # Optional SMTP configuration
      SMTP_HOST: '${SMTP_HOST:-127.0.0.1}'
      SMTP_PORT: '${SMTP_PORT:-587}'
      SMTP_USER: '${SMTP_USER:-}'
      SMTP_PASSWORD: '${SMTP_PASSWORD:-}'
      SMTP_SECURE: '${SMTP_SECURE:-false}'
      EMAIL_FROM: '${EMAIL_FROM:-}'
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f "scripts/worker.mjs" >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: postgres:18.1-alpine3.21
    restart: unless-stopped
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'cp /init-roles-source.sh /tmp/init-roles.sh && chmod 0755 /tmp/init-roles.sh && ln -sf /tmp/init-roles.sh /docker-entrypoint-initdb.d/01-init-roles.sh && exec docker-entrypoint.sh postgres',
      ]
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-ownlight_prod}'
      POSTGRES_USER: '${POSTGRES_USER:-postgres}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be set in .env.synology}'
      POSTGRES_APP_USER: '${POSTGRES_APP_USER:-ownlight_app}'
      POSTGRES_APP_PASSWORD: '${POSTGRES_APP_PASSWORD:?Error: POSTGRES_APP_PASSWORD must be set in .env.synology}'
      POSTGRES_MIGRATOR_USER: '${POSTGRES_MIGRATOR_USER:-ownlight_migrator}'
      POSTGRES_MIGRATOR_PASSWORD: '${POSTGRES_MIGRATOR_PASSWORD:?Error: POSTGRES_MIGRATOR_PASSWORD must be set in .env.synology}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sh:/init-roles-source.sh:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-ownlight_prod}']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    profiles:
      - mailpit
    environment:
      MP_DATA_DIR: /data
    ports:
      - '127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025'
    volumes:
      - mailpit_data:/data

volumes:
  postgres_data:
    name: ownlight_postgres_data
  mailpit_data:
    name: ownlight_mailpit_data
