version: 2
updates:
  # npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      npm-dependencies:
        patterns:
          - '*'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:30'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - '*'

  # Docker Compose images
  - package-ecosystem: 'docker-compose'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    groups:
      docker-compose-images:
        patterns:
          - '*'

  # Docker container images
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:30'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    groups:
      docker-images:
        patterns:
          - '*'
