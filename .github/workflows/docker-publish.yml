name: Publish Docker Image to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'v*'
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'drizzle/**'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'compose.synology.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'next.config.mjs'
      - '.github/workflows/docker-publish.yml'
      - 'projects/ownlight/**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@65538e1e7f6e076632408c69700b14e3046bc9fa # v3.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc80280f6390ac2efcf2fbbe499f550b07f43399 # v6.2.0
        with:
          images: ghcr.io/ediminator/ownlight
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}

      - name: Build and push linux/amd64 Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ediminator/ownlight:latest
            ghcr.io/ediminator/ownlight:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
