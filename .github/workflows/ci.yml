name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gate:
    name: Quality Gate (full profile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Required to checkout code
    services:
      postgres:
        image: postgres:16.8-alpine3.21
        env:
          POSTGRES_DB: ownlight_test
          POSTGRES_USER: ownlight_app
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      NODE_ENV: test
      POSTGRES_DB: ownlight_test
      POSTGRES_USER: ownlight_app
      POSTGRES_PASSWORD: changeme
      SKIP_ENV_VALIDATION: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure test database connection
        shell: bash
        run: |
          echo "DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check (Prettier)
        run: pnpm run format:check

      - name: Lint (ESLint incl. security, a11y)
        run: pnpm run lint

      - name: Type check (tsc --noEmit, strict)
        run: pnpm run typecheck

      - name: i18n catalogue completeness (en/de)
        run: pnpm run check:i18n

      - name: Unit + integration tests with coverage >= 85%
        run: pnpm run test:coverage

      - name: Production build
        run: pnpm run build

      - name: Secret scan
        run: pnpm run scan:secrets

      - name: Static application security testing
        run: pnpm run scan:sast

      - name: Dependency vulnerability audit (high+)
        run: pnpm run scan:deps

      - name: Licence compliance (AGPL-compatible allowlist)
        run: pnpm run scan:licenses

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: End-to-end tests (Playwright, incl. axe smoke)
        run: pnpm run test:e2e

      - name: Upload Playwright test report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cdxgen@12.8.5 -o bom.json -t javascript

      - name: Upload CycloneDX SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyclonedx-sbom
          path: bom.json
          retention-days: 14
