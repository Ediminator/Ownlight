services:
  postgres:
    image: postgres:18.1-alpine3.21
    restart: unless-stopped
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-ownlight_dev}'
      POSTGRES_USER: '${POSTGRES_USER:-postgres}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be set in .env}'
      POSTGRES_APP_USER: '${POSTGRES_APP_USER:-ownlight_app}'
      POSTGRES_APP_PASSWORD: '${POSTGRES_APP_PASSWORD:?Error: POSTGRES_APP_PASSWORD must be set in .env}'
      POSTGRES_MIGRATOR_USER: '${POSTGRES_MIGRATOR_USER:-ownlight_migrator}'
      POSTGRES_MIGRATOR_PASSWORD: '${POSTGRES_MIGRATOR_PASSWORD:?Error: POSTGRES_MIGRATOR_PASSWORD must be set in .env}'
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/01-init-roles.sh:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-ownlight_dev}']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    environment:
      MP_DATA_DIR: /data
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025'
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8025/api/v1/info || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  storage:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: '${STORAGE_ACCESS_KEY:?Error: STORAGE_ACCESS_KEY must be set in .env}'
      MINIO_ROOT_PASSWORD: '${STORAGE_SECRET_KEY:?Error: STORAGE_SECRET_KEY must be set in .env}'
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://127.0.0.1:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    name: ownlight_postgres_data
  mailpit_data:
    name: ownlight_mailpit_data
  minio_data:
    name: ownlight_minio_data
